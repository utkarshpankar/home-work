<div class="container mt-4">
    <h2>Student Registration form</h2>

    <!-- Name -->
   <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" id="name" class="form-control" placeholder="enter your name">
   </div>

   <!-- age -->
    <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" id="age" class="form-control" placeholder="enter your age">
    </div>

    <!-- checkboxes -->
     <div class="form-check mb-3">
        <input type="checkbox" id="agree" class="form-check-input">
        <label for="agree" class="form-check-label">i agree the terms and conditions</label>
     </div>
     
     <!-- radio buttons -->
      <div class="mb-3">
        <label class="form-label">Gender</label>
        <div class="form-check">
            <input type="radio" id="male" name="gender" class="form-check-input">
            <label for="male" class="form-check-label">Male</label>
        </div>
            <div class="form-check">
      <input
        id="female"
        type="radio"
        name="gender"
        class="form-check-input"
      >
      <label for="female" class="form-check-label">Female</label>
    </div>
      </div>
      <button type="button" class="btn btn-primary">Submit</button>
<hr>
</div>
