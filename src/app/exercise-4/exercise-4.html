
<div class="container mt-4">

  <h2>Word List</h2>

  <input type="text" class="form-control mb-2" placeholder="Enter word" [(ngModel)]="word"
  >

  <button class="btn btn-primary" (click)="add()"[disabled]="!word.trim()">
    Add
  </button>

  <h4 class="mt-3">Words ({{words.length}})</h4>

  <ul>
    @for (w of words; track w) {
      <li>{{w}} ({{w.length}})</li>
    }
    @empty {
      <li>No words yet</li>
    }
  </ul>

</div>
